name: Sync PDFs to R2
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upload PDFs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8d1432abb7a6e0cddf130308f87953ed
        run: |
          for file in src/contents/pdfs/*.pdf; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            echo "Uploading: $filename"
            npx --yes wrangler@latest r2 object put public-bucket/news/"$filename" --file="$file"
          done

      - name: Clean stale objects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8d1432abb7a6e0cddf130308f87953ed
        run: python3 .github/workflows/sync_cleanup.py

      - name: Generate and upload resources.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8d1432abb7a6e0cddf130308f87953ed
        run: |
          python3 .github/workflows/sync_gen_resources.py
          if [ -f resources.json ]; then
            echo "Uploading resources.json to R2..."
            npx --yes wrangler@latest r2 object put public-bucket/news/resources.json --file=resources.json
          fi
